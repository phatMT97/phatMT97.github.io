<style>
:root {
  --bg: #FFFFFF;
  --text: #1A1A1A;
  --text-muted: #666666;
  --accent: #1E3A5F;
  --divider: #E5E5E5;

  --font-serif: 'EB Garamond', 'Source Serif Pro', Georgia, serif;
  --font-sans: 'Inter', system-ui, sans-serif;
  --font-mono: 'JetBrains Mono', ui-monospace, monospace;

  --page-max: 720px;
  --section-gap: 36px;
  --print-section-gap: 20px;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html { font-size: 15px; }

body {
  font-family: var(--font-sans);
  color: var(--text);
  background: var(--bg);
  line-height: 1.55;
  padding: 64px 48px;
  -webkit-font-smoothing: antialiased;
}

.page {
  max-width: var(--page-max);
  margin: 0 auto;
}

a {
  color: var(--accent);
  text-decoration: none;
  border-bottom: 1px solid transparent;
  transition: border-color 0.15s;
}
a:hover { border-bottom-color: var(--accent); }

/* Header */
.cv-header { margin-bottom: 28px; }

.cv-name {
  font-family: var(--font-serif);
  font-size: 38px;
  font-weight: 500;
  letter-spacing: -0.5px;
  line-height: 1.1;
  margin-bottom: 6px;
}

.cv-role {
  font-family: var(--font-sans);
  font-size: 16px;
  color: var(--text-muted);
  font-weight: 400;
  margin-bottom: 14px;
}

.cv-contact {
  font-size: 13px;
  color: var(--text-muted);
  display: flex;
  flex-wrap: wrap;
  gap: 0 14px;
}
.cv-contact span.sep { color: var(--divider); }
.cv-contact a { color: var(--text-muted); }
.cv-contact a:hover { color: var(--accent); }

/* tasks 3-9 add more styles below */
